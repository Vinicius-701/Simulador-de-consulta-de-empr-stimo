<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Simulador de Consignado</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
        label { display: block; margin-top: .8rem; font-weight: 600; }
        input { width: 100%; padding: .5rem; box-sizing: border-box; }
        button { margin-top: 1.2rem; padding: .7rem 1.4rem; cursor: pointer; }
        .card { border: 1px solid #ccc; border-radius: 8px; padding: 1rem; margin-top: .8rem; }
        .APPROVED { border-color: #2e7d32; background: #e8f5e9; }
        .REJECTED { border-color: #c62828; background: #ffebee; }
        .UNAVAILABLE { border-color: #ef6c00; background: #fff3e0; }
        .error { color: #c62828; }
    </style>
</head>
<body>
<h1>Simulador de Empréstimo Consignado</h1>
<form id="form">
    <label>Nome <input name="nome" required></label>
    <label>E-mail <input name="email" type="email" required></label>
    <label>CPF <input name="cpf" required placeholder="000.000.000-00"></label>
    <label>Salário (R$) <input name="salario" type="number" step="0.01" required></label>
    <label>CNPJ do empregador <input name="cnpjEmpregador" required placeholder="00.000.000/0000-00"></label>
    <label>Valor solicitado (R$) <input name="valorSolicitado" type="number" step="0.01" required></label>
    <label>Prazo (meses) <input name="prazoMeses" type="number" min="6" max="96" required></label>
    <button type="submit" id="btn">Simular</button>
</form>
<div id="out"></div>

<script>
    const labels = { APPROVED: "Aprovado", REJECTED: "Reprovado", UNAVAILABLE: "Indisponível no momento" };
    const brl = v => Number(v).toLocaleString("pt-BR", { style: "currency", currency: "BRL" });

    document.getElementById("form").addEventListener("submit", async e => {
        e.preventDefault();
        const btn = document.getElementById("btn"), out = document.getElementById("out");
        const data = Object.fromEntries(new FormData(e.target));
        ["salario", "valorSolicitado"].forEach(k => data[k] = Number(data[k]));
        data.prazoMeses = Number(data.prazoMeses);

        btn.disabled = true; btn.textContent = "Consultando bancos...";
        out.innerHTML = "";
        try {
            const res = await fetch("/simulations", {
                method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(data)
            });
            const body = await res.json();
            if (!res.ok) {
                out.innerHTML = `<p class="error">${Object.values(body.errors || {}).join("<br>") || body.message}</p>`;
                return;
            }
            out.innerHTML = body.results.map(r => `
      <div class="card ${r.status}">
        <strong>${r.bank}: ${labels[r.status]}</strong>
        ${r.approvedAmount ? `<div>Valor aprovado: ${brl(r.approvedAmount)}</div>` : ""}
        ${r.reason ? `<div>Motivo: ${r.reason}</div>` : ""}
      </div>`).join("")
                + (body.unavailable ? `<p>Alguns bancos não responderam. Tente novamente em instantes.</p>` : "");
        } catch {
            out.innerHTML = `<p class="error">Não foi possível concluir a simulação.</p>`;
        } finally {
            btn.disabled = false; btn.textContent = "Simular";
        }
    });
</script>
</body>
</html>
